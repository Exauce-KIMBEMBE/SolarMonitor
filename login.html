<!doctype html>

<html lang="fr">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Connexion - SolarMonitor</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>


<body>


<main class="auth-page">


  <section class="card auth-card">


    <h1>
      Connexion
    </h1>


    <p class="muted">
      Connectez-vous pour accéder à SolarMonitor.
    </p>


    <form id="loginForm">


      <input
        id="email"
        type="email"
        placeholder="Email"
        autocomplete="email"
        required
      >


      <input
        id="password"
        type="password"
        placeholder="Mot de passe"
        autocomplete="current-password"
        required
      >


      <button
        class="pill on-btn"
        type="submit"
        id="loginBtn"
      >
        Se connecter
      </button>


    </form>


    <p
      id="message"
      style="font-weight:bold;"
    >
    </p>


    <p>

      Pas encore de compte ?

      <a href="register.html">
        Créer un compte
      </a>

    </p>


    <p>

      <a href="index.html">
        Retour à l'accueil
      </a>

    </p>


  </section>


</main>



<script>


/* =========================================================
   CONFIGURATION
   ========================================================= */

const API_URL =
  "https://solarmonitor-5093.onrender.com";


/* =========================================================
   ELEMENTS
   ========================================================= */

const form =
  document.getElementById(
    "loginForm"
  );


const message =
  document.getElementById(
    "message"
  );


const btn =
  document.getElementById(
    "loginBtn"
  );


const emailInput =
  document.getElementById(
    "email"
  );


const passwordInput =
  document.getElementById(
    "password"
  );


/* =========================================================
   CONNEXION
   ========================================================= */

form.addEventListener(
  "submit",
  async (e) => {


    e.preventDefault();


    message.style.color =
      "#9fb1ff";


    message.textContent =
      "Connexion en cours...";


    btn.disabled =
      true;


    const data = {

      email:
        emailInput.value.trim(),

      password:
        passwordInput.value

    };


    try {


      const res =
        await fetch(

          `${API_URL}/api/login`,

          {

            method:
              "POST",

            headers: {

              "Content-Type":
                "application/json"

            },

            body:
              JSON.stringify(data)

          }

        );


      const result =
        await res.json();


      /* ===================================================
         CONNEXION REUSSIE
         =================================================== */

      if (res.ok) {


        localStorage.setItem(
          "token",
          result.token
        );


        localStorage.setItem(
          "user",
          JSON.stringify(
            result.user
          )
        );


        message.style.color =
          "#1cc88a";


        /* ===============================================
           MESSAGE SELON ROLE
           =============================================== */

        if (
          result.user.role === "admin"
        ) {

          message.textContent =
            "Connexion administrateur réussie.";

        }

        else if (
          result.user.role === "manager"
        ) {

          message.textContent =
            "Connexion manager réussie.";

        }

        else {

          message.textContent =
            "Connexion réussie.";

        }


        /* ===============================================
           TOUT LE MONDE VA SUR LE DASHBOARD
           =============================================== */

        setTimeout(
          () => {

            window.location.href =
              "index.html";

          },
          600
        );


      }


      /* ===================================================
         CONNEXION REFUSEE
         =================================================== */

      else {


        message.style.color =
          "#e74c3c";


        message.textContent =
          result.error ||
          "Erreur de connexion.";


        btn.disabled =
          false;

      }


    }


    catch (err) {


      console.error(
        "Erreur connexion :",
        err
      );


      message.style.color =
        "#e74c3c";


      message.textContent =
        "Serveur inaccessible.";


      btn.disabled =
        false;

    }


  }
);


</script>


</body>

</html>
